[package]
name = "controller"
version = "0.1.0"
edition = "2021"
description = "Stellar-K8s controller: deployment pipeline, admission webhook and ephemeral testnet operator modules"
license = "Apache-2.0"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for sidecar communication and cloud provider API calls
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-manual-roots",
    "rustls-tls",
] }

# Async traits (used by CloudVolumeVerifier and KubeClient)
async-trait = "0.1"

# HTTP server (sidecar + axum handler)
axum = { version = "0.8", features = [] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Base64 encoding/decoding (WASM binary field in StellarNode spec)
base64 = "0.21"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"

# Async trait support (used by ingestion::worker::LedgerProcessor)
async-trait = "0.1"

# Temporary files for wasm-opt subprocess I/O
tempfile = "3"

# Timestamp parsing for the PDB controller's "stable for N seconds" check
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# Optional Kubernetes backend for the PDB auto-tuning controller. Kept behind
# a feature so the default build of this crate stays lean. Versions match the
# operator crate (kube 0.94 / k8s-openapi 0.22 for Kubernetes 1.30).
kube = { version = "0.94", optional = true, features = ["runtime", "client", "derive"] }
k8s-openapi = { version = "0.22", optional = true, default-features = false, features = ["v1_30"] }
futures = { version = "0.3", optional = true }
tracing-subscriber = { version = "0.3", optional = true, features = ["env-filter"] }

# StellarTestnet operator (issue #246): CRD, reconcile loop and key derivation
schemars = "0.8"
serde_yaml = "0.9"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }

[features]
default = []
# Kubernetes-backed PDB controller (`pdb::kube_backend`) and the
# `pdb-controller` binary.
kube-backend = ["dep:kube", "dep:k8s-openapi", "dep:futures", "dep:tracing-subscriber"]

[[bin]]
name = "pdb-controller"
path = "src/bin/pdb-controller.rs"
required-features = ["kube-backend"]

[[bin]]
name = "stellar-testnet-operator"
path = "src/bin/stellar-testnet-operator.rs"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
axum = { version = "0.8", features = [] }
serde_json = "1"
base64 = "0.21"

[workspace]